name: Publish protein-tools-mcp to TestPyPI / PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write   # required for Trusted Publisher OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade build twine

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # ------------------------------------------------------------------
      # Uncomment the block below for the real PyPI release. You'll also
      # need a second pending publisher registered on PyPI (same name,
      # workflow, environment name "pypi").
      # ------------------------------------------------------------------
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
